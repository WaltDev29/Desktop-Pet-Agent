<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Chat UI (with Image)</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            background-color: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-box {
            flex-grow: 1;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #4a90e2;
        }

        .message.agent {
            align-self: flex-start;
            background-color: #444;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        #input-container {
            padding: 15px;
            background-color: #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .image-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #555;
            position: relative;
        }

        .preview-wrapper {
            position: relative;
            display: inline-block;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 12px;
            line-height: 12px;
            padding: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: white;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #file-input {
            display: none;
        }

        .upload-btn {
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-btn:hover {
            background-color: #666;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .thought-log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.85em;
            color: #ddd;
            background-color: #333;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .thought-toggle {
            margin-bottom: 10px;
            background-color: #333;
            border-radius: 6px;
            padding: 10px;
        }

        .thought-toggle summary {
            cursor: pointer;
            font-weight: bold;
            color: #4a90e2;
            font-size: 0.9em;
            outline: none;
        }

        .thought-content {
            margin-top: 10px;
            font-size: 0.85em;
            color: #ddd;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .final-response {
            white-space: pre-wrap;
        }

        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        .login-box h2 {
            margin-top: 0;
            text-align: center;
            color: #4a90e2;
        }

        .login-box input {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #444;
            color: white;
            outline: none;
        }

        .login-box button {
            padding: 12px;
            background: #4a90e2;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .login-box button.skip {
            background: #555;
        }

        .login-box button:hover {
            opacity: 0.9;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2 id="auth-title">Gateway Login</h2>
            <input type="text" id="login-name" placeholder="Name (Only for Signup)" style="display: none;">
            <input type="email" id="login-email" placeholder="Email (user@example.com)">
            <input type="password" id="login-password" placeholder="Password">
            <button id="auth-btn" onclick="submitAuth()">Login</button>
            <div style="text-align: center; margin-top: 5px;">
                <a href="#" id="toggle-auth-link" onclick="toggleAuthMode(event)"
                    style="color: #4a90e2; text-decoration: none; font-size: 0.9em;">Need an account? Sign up</a>
            </div>
            <button class="skip" onclick="document.getElementById('login-overlay').style.display='none'">Skip (Local
                Mode)</button>
        </div>
    </div>

    <div id="main-layout" style="display: flex; gap: 20px; width: 100%; max-width: 900px; height: 80vh;">
        <!-- Sidebar for Sessions -->
        <div id="sidebar"
            style="width: 250px; background-color: #2a2a2a; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="createNewSession()" style="background-color: #28a745; width: 100%;">새 대화 시작 ➕</button>
            <button onclick="deleteCurrentSession()" style="background-color: #dc3545; width: 100%;">현재 세션 삭제
                🗑️</button>
            <button onclick="logout()" style="background-color: #666; width: 100%;">로그아웃 🚪</button>
            <div id="gateway-status"
                style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background-color: #333; border-radius: 8px; font-size: 0.9em; font-weight: bold; color: #ff4d4d; cursor: pointer; transition: background 0.2s;"
                onclick="retryConnection()" onmouseover="this.style.backgroundColor='#444'"
                onmouseout="this.style.backgroundColor='#333'" title="클릭하여 재연결 시도">
                <span id="gateway-icon">🔴</span>
                <span id="gateway-text">오프라인</span>
            </div>
            <hr style="border-color: #444; width: 100%;">
            <!-- 기기 목록 추가 -->
            <div>
                <h3 style="margin-top: 0; font-size: 1.1em; text-align: center;">기기 목록</h3>
                <div id="pc-list"
                    style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
                    <!-- 기기 버튼들이 여기에 추가됩니다 -->
                </div>
            </div>
            <hr style="border-color: #444; width: 100%;">
            <div id="session-list"
                style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-grow: 1;">
                <!-- 세션 리스트 렌더링 영역 -->
            </div>
        </div>

        <div id="chat-container" style="flex-grow: 1; max-width: 600px; height: 100%;">
            <div id="chat-box" style="max-height: calc(100% - 130px);">
                <div class="message agent">안녕하세요! 에이전트입니다. 궁금한 점이 있거나 이미지를 분석해보고 싶으시면 말씀해주세요.</div>
            </div>
            <div id="input-container">
                <div id="image-preview-container"></div>
                <div class="input-row">
                    <button class="upload-btn" onclick="document.getElementById('file-input').click()">업로드 🖼️</button>
                    <input type="file" id="file-input" accept="image/*" multiple>
                    <input type="text" id="message-input" placeholder="메시지를 입력하세요..."
                        onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button id="send-btn" onclick="sendMessage()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "ws://localhost:8001/ws";
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const messageInput = document.getElementById('message-input');
        const chatBox = document.getElementById('chat-box');
        const sendBtn = document.getElementById('send-btn');

        let selectedImages = []; // base64 strings
        let currentSessionId = null;
        let sessionList = [];
        let sessionTitles = {};
        let ws = null;
        let currentMessageDiv = null;
        let thoughtLogDiv = null;
        let finalResponseDiv = null;
        let isAgentBusy = false;

        let gatewayToken = null;
        let gatewayUrl = null;
        let localDeviceId = null;
        let targetAgentId = null;
        let pcList = [];

        // 에이전트 로그인 상태 확인
        async function checkStatus() {
            try {
                const res = await fetch('http://localhost:8001/api/status');
                const data = await res.json();
                if (data.is_logged_in) {
                    document.getElementById('login-overlay').style.display = 'none';

                    try {
                        const authRes = await fetch('http://localhost:8001/api/auth_info');
                        if (authRes.ok) {
                            const authData = await authRes.json();
                            gatewayToken = authData.access_token;
                            localDeviceId = authData.device_id;
                            let serverUrl = authData.api_server;
                            if (serverUrl.startsWith('http://') && serverUrl.includes('petagent.aikopo.net')) {
                                serverUrl = serverUrl.replace('http://', 'https://');
                            }
                            gatewayUrl = serverUrl;
                            if (!targetAgentId) {
                                targetAgentId = localDeviceId;
                            }
                            fetchPcList();
                        }
                    } catch (e) { }
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    if (data.is_local_mode && targetAgentId === localDeviceId) {
                        document.getElementById('gateway-icon').innerText = "🔴";
                        document.getElementById('gateway-text').innerText = "Gateway 오프라인";
                        document.getElementById('gateway-status').style.color = "#ff4d4d";
                    } else {
                        document.getElementById('gateway-icon').innerText = "🟢";
                        document.getElementById('gateway-text').innerText = "온라인";
                        document.getElementById('gateway-status').style.color = "#4CAF50";
                    }
                }
            } catch (err) {
                console.warn("에이전트 상태 확인 실패", err);
                document.getElementById('gateway-icon').innerText = "🔴";
                document.getElementById('gateway-text').innerText = "Agent 오프라인";
                document.getElementById('gateway-status').style.color = "#ff4d4d";
            }
        }
        checkStatus();
        setInterval(checkStatus, 5000); // 5초마다 상태 갱신

        async function fetchPcList() {
            if (!gatewayToken || !gatewayUrl) return [];
            try {
                let hostUrl = gatewayUrl;
                if (hostUrl.startsWith('ws')) hostUrl = hostUrl.replace('ws', 'http');
                if (hostUrl.startsWith('http://') && hostUrl.includes('petagent.aikopo.net')) {
                    hostUrl = hostUrl.replace('http://', 'https://');
                }
                const res = await fetch(`${hostUrl}/api/devices`, {
                    headers: { 'Authorization': `Bearer ${gatewayToken}` }
                });
                if (res.status === 401 || res.status === 403) {
                    console.warn("인증 토큰이 만료되었습니다.");
                    return [];
                }
                const devices = await res.json();
                pcList = devices.filter(d => d.device_type === 'pc');
                renderPcList();
                return pcList;
            } catch (err) {
                console.error(err);
                return [];
            }
        }

        function renderPcList() {
            const listDiv = document.getElementById('pc-list');
            listDiv.innerHTML = '';
            pcList.forEach(pc => {
                const btn = document.createElement('button');
                const statusIcon = pc.is_online ? '🟢' : '⚪';
                btn.innerText = `${statusIcon} ${pc.device_name} ${pc.device_id === localDeviceId ? '(로컬)' : ''}`;
                btn.style.width = "100%";
                btn.style.textAlign = "left";
                btn.style.padding = "8px 12px";
                btn.style.border = "none";
                btn.style.borderRadius = "8px";
                btn.style.cursor = "pointer";
                btn.style.color = "white";
                btn.style.marginBottom = "5px";
                btn.style.backgroundColor = (pc.device_id === targetAgentId) ? "#4a90e2" : "#444";

                btn.onclick = () => {
                    if (targetAgentId === pc.device_id) return;
                    targetAgentId = pc.device_id;

                    // 세션 리스트 초기화
                    sessionList = [];
                    currentSessionId = null;
                    renderSessionList();
                    chatBox.innerHTML = '<div class="message agent">PC가 변경되었습니다. 대화를 불러오는 중...</div>';
                    connectWebSocket();
                };
                listDiv.appendChild(btn);
            });
        }

        let isSignupMode = false;

        function toggleAuthMode(e) {
            e.preventDefault();
            isSignupMode = !isSignupMode;
            document.getElementById('auth-title').innerText = isSignupMode ? "Gateway Signup" : "Gateway Login";
            document.getElementById('login-name').style.display = isSignupMode ? "block" : "none";
            document.getElementById('auth-btn').innerText = isSignupMode ? "Sign Up" : "Login";
            document.getElementById('toggle-auth-link').innerText = isSignupMode ? "Already have an account? Login" : "Need an account? Sign up";
        }

        async function submitAuth() {
            const name = document.getElementById('login-name').value;
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('이메일과 비밀번호를 입력해주세요.');
                return;
            }
            if (isSignupMode && !name) {
                alert('이름을 입력해주세요.');
                return;
            }

            const endpoint = isSignupMode ? 'http://localhost:8001/api/signup' : 'http://localhost:8001/api/login';
            const bodyData = isSignupMode ? { email, password, name } : { email, password };

            try {
                // Agent의 로컬 API로 인증 요청
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert((isSignupMode ? '회원가입' : '로그인') + ' 성공! 게이트웨이와 연결을 시도합니다.');
                    document.getElementById('login-overlay').style.display = 'none';
                } else {
                    alert((isSignupMode ? '회원가입' : '로그인') + ' 실패: ' + data.message);
                }
            } catch (err) {
                alert('에이전트 로컬 서버와 통신할 수 없습니다: ' + err);
            }
        }

        async function logout() {
            if (!confirm('로그아웃 하시겠습니까?')) return;
            try {
                const res = await fetch('http://localhost:8001/api/logout', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    // 세션 리스트 초기화 및 UI 리셋
                    sessionList = [];
                    currentSessionId = null;
                    renderSessionList();
                    chatBox.innerHTML = '<div class="message agent">로그아웃 되었습니다. 게이트웨이에 다시 로그인 해주세요.</div>';

                    // 모달 재표시
                    document.getElementById('login-overlay').style.display = 'flex';
                } else {
                    alert('로그아웃 실패: ' + data.message);
                }
            } catch (e) {
                alert('로그아웃 요청 실패: ' + e);
            }
        }

        // 세션 리스트 UI 갱신 로직 (localStorage 제거)
        function updateSessionStorage() {
            if (currentSessionId && !sessionList.includes(currentSessionId)) {
                sessionList.push(currentSessionId);
            }
            renderSessionList();
        }

        function renderSessionList() {
            const listDiv = document.getElementById('session-list');
            listDiv.innerHTML = '';
            sessionList.forEach(sid => {
                const btn = document.createElement('button');
                const title = sessionTitles[sid] || ("세션: " + sid.substring(0, 6) + "...");
                btn.innerText = title;
                btn.style.width = "100%";
                btn.style.textAlign = "left";
                btn.style.backgroundColor = (sid === currentSessionId) ? "#4a90e2" : "#444";

                // 우클릭으로 제목 수정
                btn.oncontextmenu = (e) => {
                    e.preventDefault();
                    const newTitle = prompt("세션 제목을 수정하세요:", sessionTitles[sid] || "");
                    if (newTitle && newTitle.trim() !== "") {
                        sessionTitles[sid] = newTitle.trim();
                        renderSessionList();

                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: "session_update",
                                payload: {
                                    session_id: sid,
                                    title: newTitle.trim()
                                }
                            }));
                        }
                    }
                };

                btn.onclick = () => {
                    currentSessionId = sid;
                    chatBox.innerHTML = '<div class="message agent">세션(' + sid.substring(0, 6) + ')의 대화를 불러오는 중...</div>';

                    // 서버에 대화 이력 요청
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: "get_history",
                            payload: { session_id: sid }
                        }));
                    }
                    renderSessionList();
                };
                listDiv.appendChild(btn);
            });
        }

        function isTargetAgentOnline() {
            if (!targetAgentId) return false;
            // 로컬 에이전트인 경우 (자신)
            if (targetAgentId === localDeviceId) {
                return ws && ws.readyState === WebSocket.OPEN;
            }
            // 원격 에이전트인 경우 pcList에서 확인
            const target = pcList.find(pc => pc.device_id === targetAgentId);
            return target ? target.is_online : false;
        }

        function createNewSession() {
            if (!isTargetAgentOnline()) {
                alert("선택한 기기가 오프라인 상태입니다.");
                return;
            }
            const newSid = crypto.randomUUID();
            currentSessionId = newSid;

            // 1. 낙관적 UI 업데이트
            if (!sessionList.includes(newSid)) {
                sessionList.unshift(newSid);
                renderSessionList();
            }

            chatBox.innerHTML = '<div class="message agent">새로운 대화 세션이 시작되었습니다.</div>';

            // 2. 서버에 알림
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "session_created",
                    payload: { session_id: currentSessionId }
                }));
            }
        }

        function deleteCurrentSession() {
            if (!isTargetAgentOnline()) {
                alert("선택한 기기가 오프라인 상태입니다.");
                return;
            }
            if (!currentSessionId) return;
            if (!confirm('현재 세션을 삭제하시겠습니까?')) return;

            const sidToDelete = currentSessionId;

            // 1. 낙관적 UI 업데이트
            sessionList = sessionList.filter(s => s !== sidToDelete);
            updateAfterDeletion();

            // 2. 서버에 삭제 요청 전송
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "session_deleted",
                    payload: { session_id: sidToDelete }
                }));
            }
        }

        function updateAfterDeletion() {
            chatBox.innerHTML = '<div class="message agent">진행 중이던 세션이 완전히 폐기되었습니다. 우측 상단에서 새 대화를 시작해주세요.</div>';
            currentSessionId = sessionList.length > 0 ? sessionList[sessionList.length - 1] : null;
            renderSessionList();
        }

        renderSessionList();

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }

            if (targetAgentId === localDeviceId || !targetAgentId) {
                // 내 로컬 PC (기존 로컬 에이전트 연결)
                ws = new WebSocket(API_URL);

                ws.onopen = () => {
                    appendMessage("로컬 에이전트 서버와 연결되었습니다. 🟢", "agent");
                    ws.send(JSON.stringify({
                        type: "register",
                        payload: {
                            role: "desktop"
                        }
                    }));
                    checkStatus();
                };
            } else {
                // 다른 원격 PC 제어 ('app' 권한으로 게이트웨이 접속)
                let wsHost = gatewayUrl;
                if (wsHost.startsWith('http')) wsHost = wsHost.replace('http', 'ws');
                const dynamicApiUrl = `${wsHost}/ws?token=${gatewayToken}`;
                ws = new WebSocket(dynamicApiUrl);

                ws.onopen = () => {
                    document.getElementById('gateway-icon').innerText = "🟢";
                    document.getElementById('gateway-text').innerText = "온라인";
                    document.getElementById('gateway-status').style.color = "#4CAF50";
                    appendMessage("원격 에이전트와 연결되었습니다. 🟢", "agent");
                    ws.send(JSON.stringify({
                        type: "register",
                        payload: {
                            role: "app",
                            client_id: crypto.randomUUID(),
                            target_agent_id: targetAgentId
                        }
                    }));
                };
            }

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    const type = msg.type;
                    const data = msg.payload;

                    console.log(`[WS Receive] type: ${type}`, data);

                    if (!data) return;

                    // 세션 필터링이 필요한 메시지 유형 정의
                    const sessionBoundTypes = [
                        "chat", "approval_request", "approval_response",
                        "log", "token", "done", "status", "history_res"
                    ];
                    if (sessionBoundTypes.includes(type)) {
                        if (data.session_id && currentSessionId &&
                            data.session_id.toLowerCase() !== currentSessionId.toLowerCase()) {
                            return; // 다른 세션의 메시지이므로 무시
                        }
                    }

                    // 1. 승인 요청 (approval_request)
                    if (type === "approval_request") {
                        currentMessageDiv = null;
                        thoughtLogDiv = null;
                        finalResponseDiv = null;
                        appendMessage(`⚠️ 승인 필요: ${data.message || ""}`, "agent");
                        renderApprovalButtons();
                    }
                    // 2. 로그 (log)
                    else if (type === "log") {
                        if (!data.status) return;
                        const status = data.status;

                        if (status === "error") {
                            currentMessageDiv = null;
                            thoughtLogDiv = null;
                            finalResponseDiv = null;
                            appendMessage(`❌ 에러: ${data.message || "알 수 없는 오류"}`, "agent");
                            resetSendButton();
                        } else if (status === "info") {
                            appendMessage(`ℹ️ 안내: ${data.message || ""}`, "agent");
                        } else if (status === "node_start") {
                            const nodeName = data.node;
                            if (!currentMessageDiv) {
                                currentMessageDiv = appendMessage("", "agent");
                                currentMessageDiv.innerHTML = "";
                                thoughtLogDiv = document.createElement("div");
                                thoughtLogDiv.className = "thought-log";
                                currentMessageDiv.appendChild(thoughtLogDiv);
                            }

                            if (nodeName === "aggregator") {
                                if (thoughtLogDiv && !thoughtLogDiv.classList.contains("finalized")) {
                                    const details = document.createElement("details");
                                    details.className = "thought-toggle";
                                    const summary = document.createElement("summary");
                                    summary.innerText = "사고 과정 보기";
                                    const contentDiv = document.createElement("div");
                                    contentDiv.className = "thought-content";
                                    contentDiv.innerText = thoughtLogDiv.innerText;

                                    details.appendChild(summary);
                                    details.appendChild(contentDiv);
                                    currentMessageDiv.replaceChild(details, thoughtLogDiv);
                                    thoughtLogDiv = null;
                                }

                                finalResponseDiv = document.createElement("div");
                                finalResponseDiv.className = "final-response";
                                currentMessageDiv.appendChild(finalResponseDiv);
                                chatBox.scrollTop = chatBox.scrollHeight;
                            } else {
                                if (thoughtLogDiv) {
                                    thoughtLogDiv.innerText += `\n[⚙️ ${nodeName} 동작 중...]\n`;
                                    thoughtLogDiv.scrollTop = thoughtLogDiv.scrollHeight;
                                }
                                chatBox.scrollTop = chatBox.scrollHeight;
                            }
                        } else if (status === "tool_start") {
                            if (!currentMessageDiv) {
                                currentMessageDiv = appendMessage("", "agent");
                                currentMessageDiv.innerHTML = "";
                                thoughtLogDiv = document.createElement("div");
                                thoughtLogDiv.className = "thought-log";
                                currentMessageDiv.appendChild(thoughtLogDiv);
                            }
                            const toolInputStr = typeof data.tool_input === 'object' ? JSON.stringify(data.tool_input) : data.tool_input;
                            if (thoughtLogDiv) {
                                thoughtLogDiv.innerText += `\n[🛠️ 도구 호출: ${data.tool_name}] 파라미터: ${toolInputStr}\n`;
                                thoughtLogDiv.scrollTop = thoughtLogDiv.scrollHeight;
                            }
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                    }
                    // 3. 토큰 (token)
                    else if (type === "token") {
                        if (!currentMessageDiv) {
                            currentMessageDiv = appendMessage("", "agent");
                            currentMessageDiv.innerHTML = "";
                            thoughtLogDiv = document.createElement("div");
                            thoughtLogDiv.className = "thought-log";
                            currentMessageDiv.appendChild(thoughtLogDiv);
                        }

                        if (finalResponseDiv) {
                            finalResponseDiv.rawText = (finalResponseDiv.rawText || "") + data.chunk;
                            if (typeof marked !== 'undefined') {
                                finalResponseDiv.innerHTML = marked.parse(finalResponseDiv.rawText);
                            } else {
                                finalResponseDiv.innerText = finalResponseDiv.rawText;
                            }
                        } else if (thoughtLogDiv) {
                            thoughtLogDiv.innerText += data.chunk;
                            thoughtLogDiv.scrollTop = thoughtLogDiv.scrollHeight;
                        }
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                    // 4. 완료 (done)
                    else if (type === "done") {
                        currentMessageDiv = null;
                        thoughtLogDiv = null;
                        finalResponseDiv = null;
                        resetSendButton();
                        // 게이트웨이 DB 보정용으로 final_message가 들어오더라도 화면에 중복 출력하지 않음
                    }
                    // 5. 채팅 메시지 동기화 (chat)
                    else if (type === "chat") {
                        const msgId = data.message_id;
                        if (window.sentMessageIds && window.sentMessageIds.has(msgId)) return;
                        appendMessage(data.message, "user", data.images || []);
                    }
                    // 6. 승인 결과 동기화
                    else if (type === "approval_response") {
                        appendMessage(data.approve ? "✅ 승인합니다. (앱에서 승인됨)" : "❌ 거절합니다. (앱에서 거절됨)", "user");
                    }
                    // 7. 세션 초기 동기화
                    else if (type === "session_sync") {
                        const rawSessions = data.sessions || [];
                        sessionList = rawSessions.map(s => {
                            if (typeof s === 'object') {
                                if (s.title) sessionTitles[s.session_id] = s.title;
                                return s.session_id;
                            }
                            return s;
                        });
                        if (currentSessionId && !sessionList.includes(currentSessionId)) {
                            currentSessionId = sessionList.length > 0 ? sessionList[0] : null;
                        } else if (!currentSessionId && sessionList.length > 0) {
                            currentSessionId = sessionList[0];
                        }
                        renderSessionList();
                    }
                    // 8. 세션 생성 동기화
                    else if (type === "session_created") {
                        const sid = data.session_id;
                        if (data.title) sessionTitles[sid] = data.title;
                        if (!sessionList.includes(sid)) {
                            sessionList.unshift(sid);
                            renderSessionList();
                        }
                    }
                    // 8-1. 세션 제목 업데이트 동기화
                    else if (type === "session_update") {
                        const sid = data.session_id;
                        if (data.title) {
                            sessionTitles[sid] = data.title;
                            renderSessionList();
                        }
                    }
                    // 9. 세션 삭제 동기화
                    else if (type === "session_deleted") {
                        const sid = data.session_id;
                        sessionList = sessionList.filter(s => s !== sid);
                        if (currentSessionId === sid) {
                            updateAfterDeletion();
                        } else {
                            renderSessionList();
                        }
                    }
                    // 10. 대화 이력 수신
                    else if (type === "history_res") {
                        chatBox.innerHTML = ''; // 초기화
                        if (data.history && data.history.length > 0) {
                            data.history.forEach(m => {
                                appendMessage(m.message, m.role, m.images || []);
                            });
                        } else {
                            chatBox.innerHTML = '<div class="message agent">이전 대화가 없습니다.</div>';
                        }
                    }
                    // 11. 에이전트 상태 동기화 (Busy/Ready)
                    else if (type === "status") {
                        setAgentBusy(data.status === "busy");
                    }
                } catch (err) {
                    console.error("[WS Message Error]", err, event.data);
                }
            };

            ws.onclose = () => {
                document.getElementById('gateway-icon').innerText = "🔴";
                document.getElementById('gateway-text').innerText = "Agent 오프라인";
                document.getElementById('gateway-status').style.color = "#ff4d4d";
                currentMessageDiv = null;
                thoughtLogDiv = null;
                finalResponseDiv = null;
                appendMessage("서버와의 연결이 끊어졌습니다. 새로고침 해주세요. 🔴", "agent");
                resetSendButton();
            };

            ws.onerror = (error) => {
                console.error("WebSocket Error:", error);
            };
        }

        // 초기 웹소켓 연결
        connectWebSocket();

        async function retryConnection() {
            if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
                document.getElementById('gateway-icon').innerText = "🟡";
                document.getElementById('gateway-text').innerText = "Agent 재연결 중...";
                document.getElementById('gateway-status').style.color = "#ffc107";
                connectWebSocket();
                checkStatus();
            } else if (ws.readyState === WebSocket.OPEN) {
                document.getElementById('gateway-icon').innerText = "🟡";
                document.getElementById('gateway-text').innerText = "Gateway 재연결 중...";
                document.getElementById('gateway-status').style.color = "#ffc107";
                try {
                    const res = await fetch('http://localhost:8001/api/reconnect', { method: 'POST' });
                    const data = await res.json();
                    if (data.status === 'error') {
                        alert(data.message);
                    }
                } catch (e) {
                    alert("재연결 요청 실패: " + e);
                }
                setTimeout(checkStatus, 2000);
            }
        }

        function resetSendButton() {
            setAgentBusy(false);
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (selectedImages.length + files.length > 3) {
                alert("이미지는 최대 3개까지만 업로드 가능합니다.");
                return;
            }

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result;
                    selectedImages.push(base64);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = ''; // reset 
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((imgBase64, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'preview-wrapper';

                const img = document.createElement('img');
                img.src = imgBase64;
                img.className = 'image-preview';

                const btn = document.createElement('button');
                btn.className = 'remove-btn';
                btn.innerText = 'X';
                btn.onclick = () => {
                    selectedImages.splice(index, 1);
                    renderPreviews();
                };

                wrapper.appendChild(img);
                wrapper.appendChild(btn);
                previewContainer.appendChild(wrapper);
            });
        }

        function appendMessage(text, role, images = []) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            if (role === 'agent' && typeof marked !== 'undefined') {
                msgDiv.innerHTML = marked.parse(text);
            } else {
                msgDiv.innerText = text;
            }

            images.forEach(imgBase64 => {
                const img = document.createElement('img');
                img.src = imgBase64;
                msgDiv.appendChild(img);
            });

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function renderApprovalButtons() {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message user`;
            msgDiv.style.backgroundColor = "transparent";
            msgDiv.style.display = "flex";
            msgDiv.style.gap = "10px";

            const approveBtn = document.createElement('button');
            approveBtn.innerText = '✅ 승인 (True)';
            approveBtn.style.backgroundColor = '#28a745';
            approveBtn.onclick = () => {
                msgDiv.remove();
                handleApprove(true);
            };

            const rejectBtn = document.createElement('button');
            rejectBtn.innerText = '❌ 거절 (False)';
            rejectBtn.style.backgroundColor = '#dc3545';
            rejectBtn.onclick = () => {
                msgDiv.remove();
                handleApprove(false);
            };

            msgDiv.appendChild(approveBtn);
            msgDiv.appendChild(rejectBtn);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setAgentBusy(isBusy) {
            isAgentBusy = isBusy;
            messageInput.disabled = isBusy;
            if (isBusy) {
                sendBtn.innerHTML = '중단 🚫';
                sendBtn.style.backgroundColor = "#dc3545";
                sendBtn.style.opacity = "1";
                sendBtn.disabled = false;
            } else {
                sendBtn.innerHTML = '전송';
                sendBtn.style.backgroundColor = "#4a90e2";
                sendBtn.style.opacity = "1";
                sendBtn.disabled = false;
            }
        }

        function handleApprove(approve) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (!currentSessionId) {
                createNewSession();
            }

            appendMessage(approve ? "✅ 승인합니다." : "❌ 거절합니다.", "user");

            setAgentBusy(true);

            ws.send(JSON.stringify({
                type: "approval_response",
                payload: {
                    approve: approve,
                    session_id: currentSessionId
                }
            }));
        }

        function sendMessage() {
            if (!isTargetAgentOnline()) {
                alert("선택한 기기가 오프라인 상태입니다.");
                return;
            }

            if (isAgentBusy) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                if (currentSessionId) {
                    ws.send(JSON.stringify({
                        type: "stop",
                        payload: { session_id: currentSessionId }
                    }));
                }
                return;
            }

            const text = messageInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            // session_id 필수 체크 및 자동 생성
            if (!currentSessionId) {
                createNewSession();
            }

            // [추가] 전송 즉시 로컬 UI 잠금 (낙관적 락)
            setAgentBusy(true);

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendMessage("서버와 연결되어 있지 않습니다.", "agent");
                return;
            }

            // UI 업데이트
            appendMessage(text || "이미지 전송", "user", selectedImages);
            messageInput.value = '';
            const currentImages = [...selectedImages];
            selectedImages = [];
            renderPreviews();

            const msgId = crypto.randomUUID();
            window.sentMessageIds = window.sentMessageIds || new Set();
            window.sentMessageIds.add(msgId);

            ws.send(JSON.stringify({
                type: "chat",
                payload: {
                    message_id: msgId,
                    message: text || "",
                    images: currentImages,
                    session_id: currentSessionId
                }
            }));
        }
    </script>
</body>

</html>
