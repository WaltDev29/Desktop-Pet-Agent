version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: petagent
      POSTGRES_PASSWORD: petpassword
      POSTGRES_DB: petagent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petagent -d petagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://petagent:petpassword@db:5432/petagent_db
      - SECRET_KEY=your-super-secret-key-change-me
      - ALGORITHM=HS256
      - TOKEN_EXPIRE_HOURS=1
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
