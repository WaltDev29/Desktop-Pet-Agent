version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - ../env/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 외부 포트는 .env 파일의 DB_PORT 값을 주입받고, 컨테이너 내부는 5432 고정입니다.
      - "${DB_PORT}:5432"
    healthcheck:
      # env_file에서 주입된 쉘 변수값을 조회하도록 $$를 붙입니다.
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    env_file:
      - ../env/.env.api
    volumes:
      - ../../uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${API_PORT}:80"
    volumes:
      - ../../services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
